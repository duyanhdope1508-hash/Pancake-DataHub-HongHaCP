x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pancake_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@db:5432/${POSTGRES_DB:-pancake_data}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-6}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-2}
  DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-15}
  DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
  PANCAKE_API_BASE_URL: ${PANCAKE_API_BASE_URL:-https://pos.pages.fm/api/v1}
  PANCAKE_API_KEY: ${PANCAKE_API_KEY:-}
  PANCAKE_SHOP_IDS: ${PANCAKE_SHOP_IDS:-}
  PANCAKE_CONNECTORS_FILE: ${PANCAKE_CONNECTORS_FILE:-secrets/pancake_connectors.json}
  PANCAKE_PAGES_CONNECTORS_FILE: ${PANCAKE_PAGES_CONNECTORS_FILE:-secrets/pancake_pages_connectors.json}
  TELEGRAM_ALERTS_FILE: ${TELEGRAM_ALERTS_FILE:-secrets/telegram_alerts.json}
  PANCAKE_PAGE_SIZE: ${PANCAKE_PAGE_SIZE:-100}
  PANCAKE_START_PAGE: ${PANCAKE_START_PAGE:-1}
  PANCAKE_MAX_PAGES: ${PANCAKE_MAX_PAGES:-1}
  PANCAKE_INCREMENTAL_MAX_PAGES: ${PANCAKE_INCREMENTAL_MAX_PAGES:-100}
  PANCAKE_INCREMENTAL_UNCHANGED_PAGES: ${PANCAKE_INCREMENTAL_UNCHANGED_PAGES:-2}
  PANCAKE_SYNC_CONCURRENCY: ${PANCAKE_SYNC_CONCURRENCY:-2}
  PANCAKE_RESUME_BACKFILL: ${PANCAKE_RESUME_BACKFILL:-false}
  PANCAKE_SYNC_INTERVAL_SECONDS: ${PANCAKE_SYNC_INTERVAL_SECONDS:-43200}

x-container-logging: &container-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  db:
    image: postgres:17.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pancake_data}
      POSTGRES_USER: ${POSTGRES_USER:-pancake_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *container-logging
    mem_limit: 640m
    cpus: 1.25
    pids_limit: 256
    stop_grace_period: 1m

  api:
    image: pancake-data-hub:${APP_VERSION:-production}
    build:
      context: .
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    init: true
    environment:
      <<: *app-environment
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-12}
      AUTH_COOKIE_SECURE: "true"
      TRUSTED_HOSTS: ${DATAHUB_DOMAIN:?Set DATAHUB_DOMAIN in .env.production},api,localhost,127.0.0.1
      AUTH_LOGIN_MAX_FAILURES: ${AUTH_LOGIN_MAX_FAILURES:-5}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-900}
      AUTH_LOGIN_LOCK_SECONDS: ${AUTH_LOGIN_LOCK_SECONDS:-900}
      AUTH_STAFF_MAX_SESSIONS: ${AUTH_STAFF_MAX_SESSIONS:-2}
      STAFF_ORDER_ROWS_PER_5_MINUTES: ${STAFF_ORDER_ROWS_PER_5_MINUTES:-300}
      STAFF_ORDER_ROWS_PER_HOUR: ${STAFF_ORDER_ROWS_PER_HOUR:-2000}
      STAFF_ORDER_DETAILS_PER_HOUR: ${STAFF_ORDER_DETAILS_PER_HOUR:-120}
      ADMIN_ORDER_ROWS_PER_HOUR: ${ADMIN_ORDER_ROWS_PER_HOUR:-20000}
      ADMIN_ORDER_DETAILS_PER_HOUR: ${ADMIN_ORDER_DETAILS_PER_HOUR:-1200}
      STAFF_EXPORTS_PER_HOUR: ${STAFF_EXPORTS_PER_HOUR:-5}
      STAFF_EXPORT_ROWS_PER_DAY: ${STAFF_EXPORT_ROWS_PER_DAY:-2000}
      AUDIT_DETAIL_DEDUP_SECONDS: ${AUDIT_DETAIL_DEDUP_SECONDS:-600}
      AUDIT_DETAIL_RETENTION_DAYS: ${AUDIT_DETAIL_RETENTION_DAYS:-90}
      AUDIT_GENERAL_RETENTION_DAYS: ${AUDIT_GENERAL_RETENTION_DAYS:-365}
      AUDIT_CLEANUP_INTERVAL_SECONDS: ${AUDIT_CLEANUP_INTERVAL_SECONDS:-86400}
      EXPORT_TEMP_DIR: /app/export-tmp
    volumes:
      - ./secrets:/app/secrets:ro
      - ./export-tmp:/app/export-tmp:rw
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks:
      - proxy
      - data
    depends_on:
      db:
        condition: service_healthy
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --no-server-header
      - --no-access-log
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging: *container-logging
    mem_limit: 640m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 30s

  worker:
    image: pancake-data-hub:${APP_VERSION:-production}
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    init: true
    environment:
      <<: *app-environment
      DATABASE_POOL_SIZE: ${WORKER_DATABASE_POOL_SIZE:-3}
      DATABASE_MAX_OVERFLOW: ${WORKER_DATABASE_MAX_OVERFLOW:-1}
      AUDIT_DETAIL_RETENTION_DAYS: ${AUDIT_DETAIL_RETENTION_DAYS:-90}
      AUDIT_GENERAL_RETENTION_DAYS: ${AUDIT_GENERAL_RETENTION_DAYS:-365}
      AUDIT_CLEANUP_INTERVAL_SECONDS: ${AUDIT_CLEANUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./secrets:/app/secrets:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - data
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging: *container-logging
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 2m

  connector-admin:
    image: pancake-data-hub:${APP_VERSION:-production}
    profiles: ["tools"]
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    init: true
    environment:
      PANCAKE_API_BASE_URL: ${PANCAKE_API_BASE_URL:-https://pos.pages.fm/api/v1}
      PANCAKE_CONNECTORS_FILE: /app/secrets/pancake_connectors.json
    volumes:
      - ./secrets:/app/secrets:rw
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - proxy
    command: ["python", "-m", "app.add_connectors"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging: *container-logging
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  telegram-admin:
    image: pancake-data-hub:${APP_VERSION:-production}
    profiles: ["tools"]
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    init: true
    environment:
      TELEGRAM_ALERTS_FILE: /app/secrets/telegram_alerts.json
    volumes:
      - ./secrets:/app/secrets:rw
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - proxy
    command: ["python", "-m", "app.setup_telegram_alerts"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging: *container-logging
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    user: "${CLOUDFLARED_UID:-1000}:${CLOUDFLARED_GID:-1000}"
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    networks:
      - proxy
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging: *container-logging
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 128
    stop_grace_period: 30s

networks:
  proxy:
  data:

volumes:
  postgres_data:

secrets:
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token

